<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AndroidStream</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><strong>AndroidStream</strong><span>局域网 · 0.1.30-test</span><span id="status" role="status">未连接</span></header>
<main>
<aside>
<button id="connect" type="button">连接手机</button>
<button id="disconnect" disabled>断开连接</button>
<div class="nav"><button id="screen-off" disabled>关闭手机屏幕</button><button id="screen-on" disabled>点亮手机屏幕</button></div>
<p id="screen-power-state" class="stats-note" role="status"></p>
<label class="check"><input id="audio" type="checkbox">播放手机内部音频</label>
<div class="nav"><button data-key="4">返回</button><button data-key="3">主页</button><button data-key="187">最近任务</button><button data-key="25">音量 −</button><button data-key="24">音量 ＋</button></div>
<details id="text-entry"><summary>输入文本</summary><form id="textform"><label for="text">可映射字符</label><textarea id="text" maxlength="512" placeholder="暂不支持中文输入法"></textarea><button>发送</button></form></details>
<details id="stats" open>
<summary>连接统计</summary>
<dl class="stats-grid">
<dt>接收码率</dt><dd id="stat-bitrate">—</dd>
<dt>画面</dt><dd id="stat-picture">—</dd>
<dt>网络 RTT</dt><dd id="stat-rtt">—</dd>
<dt>丢包率</dt><dd id="stat-loss">—</dd>
<dt>解码均值</dt><dd id="stat-decode">—</dd>
<dt>抖动缓冲</dt><dd id="stat-buffer">—</dd>
</dl>
<p class="stats-note">每秒刷新，折叠或隐藏页面时暂停。仅统计视频；RTT 为网络往返时间，不是操作延迟。</p>
</details>
<p id="error" role="alert"></p>
</aside>
<section id="screen" tabindex="0" aria-label="手机画面"><video id="video" autoplay playsinline muted></video><p id="empty">连接手机后显示画面</p></section>
</main>
</body></html>
